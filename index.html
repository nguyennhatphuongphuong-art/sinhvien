<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ĐỜI NÀY CÓ GÌ VUI? — V2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101216;color:#f6f1e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}
#game{width:min(100vw,540px);height:100%;margin:auto;position:relative;background:#1d2520;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{background:#171a19dd;border:1px solid #ffffff22;border-radius:999px;padding:6px 9px;font-size:12px;backdrop-filter:blur(5px)}
#actions{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:4px;pointer-events:auto}
.btn{border:1px solid #ffffff22;background:#171a19dd;color:#fff;border-radius:12px;font-size:18px;min-width:44px;min-height:44px}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.quick{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:end;max-width:190px}
.quick .btn{font-size:13px;padding:0 11px}
#panel{position:absolute;inset:9% 5% 9%;background:#151816f5;border:1px solid #ffffff25;border-radius:20px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px #0009}
#panel.show{display:flex}.panelHead{padding:14px 16px;border-bottom:1px solid #ffffff16;display:flex;justify-content:space-between;align-items:center}
.panelTitle{font-weight:800}.panelBody{padding:14px;overflow:auto}.card{background:#202522;border:1px solid #ffffff12;border-radius:15px;padding:12px;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{color:#aab2aa;font-size:12px}.gold{color:#ffd66b}.danger{color:#ff9b9b}
.action{background:#d8b56b;color:#17130b;border:0;border-radius:10px;padding:9px 12px;font-weight:800}
input,textarea{width:100%;background:#0e1110;color:#fff;border:1px solid #ffffff20;border-radius:10px;padding:10px;font:inherit}
textarea{min-height:70px;resize:none}.chat{display:flex;flex-direction:column;gap:8px}.msg{max-width:84%;padding:9px 11px;border-radius:14px;line-height:1.35;font-size:13px}.me{align-self:end;background:#365342}.npc{align-self:start;background:#292d2a}.smallbtn{border:1px solid #ffffff18;background:#252a27;color:#fff;border-radius:9px;padding:7px 9px}
#toast{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:#1118;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.on{opacity:1}.debug{position:absolute;right:8px;bottom:4px;color:#fff0;font:9px monospace;pointer-events:none}
@media (min-width:700px){#game{height:96vh;margin-top:2vh;border-radius:24px;box-shadow:0 20px 70px #0008}}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="540" height="960"></canvas>
<div id="hud">
 <div class="pill" id="day">Ngày 1 · 07:30</div><div class="pill gold" id="money">1.000.000đ</div>
 <div class="pill" id="energy">⚡ 82</div><div class="pill" id="mood">🙂 60</div><div class="pill" id="place">Phòng trọ</div>
</div>
<div id="actions">
 <div class="pad"><button class="btn up">▲</button><button class="btn left">◀</button><button class="btn down">▼</button><button class="btn right">▶</button></div>
 <div class="quick"><button class="btn" id="phone">📱 Điện thoại</button><button class="btn" id="interact">◎ Tương tác</button><button class="btn" id="home">⌂ Về trọ</button></div>
</div>
<div id="toast"></div>
<div id="panel"><div class="panelHead"><div class="panelTitle" id="ptitle">Điện thoại</div><button class="smallbtn" id="close">Đóng</button></div><div class="panelBody" id="pbody"></div></div>
<div class="debug" id="debug"></div>
</div>
<script>

const c=document.getElementById("c"),x=c.getContext("2d");x.imageSmoothingEnabled=false;
const W=540,H=960, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), money=n=>n.toLocaleString("vi-VN")+"đ";

];
let keys={};
const near=(a,b,d=55)=>Math.hypot(a.x-b.x,a.y-b.y)<d;
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function timeStr(){let h=Math.floor(S.mins/60)%24,m=S.mins%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function advance(n){S.mins+=n;S.energy=clamp(S.energy-Math.ceil(n/28),0,100); if(S.mins>=1380){S.day++;S.mins=450;S.energy=82;S.mood=clamp(S.mood+5,0,100);S.place="room";S.player.x=270;S.player.y=760;toast("Một ngày nữa bắt đầu.");} save()}
function save(){try{localStorage.setItem("dncv_state",JSON.stringify(S))}catch{}}
function load(){try{let z=JSON.parse(localStorage.getItem("dncv_state"));if(z&&z.player)Object.assign(S,z)}catch{}}
function buildingAt(px,py){return buildings.find(b=>px>b.x&&px<b.x+b.w&&py>b.y&&py<b.y+b.h)}
function pxRect(px,py,w,h,c){x.fillStyle=c;x.fillRect(Math.round(px),Math.round(py),Math.round(w),Math.round(h))}
function text(txt,px,py,size=9,c="#f5e4bc",align="center"){x.fillStyle=c;x.font=`bold ${size}px monospace`;x.textAlign=align;x.fillText(txt,px,py)}
function tileNoise(px,py,w,h,base,seed=1){pxRect(px,py,w,h,base);for(let i=0;i<Math.floor(w*h/220);i++){let xx=px+((i*37+seed*13)%Math.max(1,w)),yy=py+((i*19+seed*7)%Math.max(1,h));pxRect(xx,yy,2+(i%3),1,i%2?"#5e625d":"#85857b")}}
function curb(y){for(let xx=0;xx<W;xx+=18){pxRect(xx,y,17,7,xx%36?"#99968e":"#c0bbb0");pxRect(xx,y+7,17,3,"#6e6c66")}}
function windowUnit(px,py,lit=false){pxRect(px,py,25,20,"#3f4644");pxRect(px+2,py+2,21,16,lit?"#d2ad63":"#91b2b0");pxRect(px+11,py+2,2,16,"#56615d");pxRect(px+2,py+9,21,2,"#56615d")}
function signBoard(px,py,w,label,bg="#efe0a8",fg="#3c342b"){pxRect(px,py,w,19,bg);pxRect(px+3,py+3,w-6,2,"#b59b69");text(label,px+w/2,py+14,8,fg)}
function awning(px,py,w){pxRect(px,py,w,8,"#d6b477");for(let xx=px;xx<px+w;xx+=16)pxRect(xx,py,8,8,xx%32?"#b95d52":"#eee1c5")}
function plant(px,py){pxRect(px-2,py,4,18,"#69503b");pxRect(px-10,py-5,9,7,"#3f7147");pxRect(px+2,py-10,10,8,"#4d8050");pxRect(px-5,py-16,9,8,"#355f3c")}
function scooter(px,py,body="#bd6156"){x.fillStyle="#191d1b";x.fillRect(px,py,33,8);x.fillRect(px+2,py+6,8,7);x.fillRect(px+23,py+6,8,7);x.fillStyle=body;x.fillRect(px+8,py-7,15,9);x.fillRect(px+19,py-12,3,8);x.fillStyle="#d9d0bc";x.fillRect(px+22,py-14,2,6);}
function tableSet(px,py){pxRect(px,py,30,5,"#6c5143");pxRect(px+4,py+5,4,14,"#6c5143");pxRect(px+22,py+5,4,14,"#6c5143");pxRect(px-6,py+7,10,6,"#a06a51");pxRect(px+26,py+7,10,6,"#a06a51")}
function facade(b,night){
  const palettes={room:["#9a7057","#d2a276"],school:["#78917d","#d0c39a"],rice:["#a96f4d","#e0b56f"],office:["#697784","#b6c2c1"],shop:["#8c875c","#d6bf77"],cafe:["#795a51","#c99a70"],park:["#4f774e","#86a866"],bus:["#68726c","#c6ad72"]};
  let [wall,trim]=palettes[b.id]||[b.col,"#d0b07a"];tileNoise(b.x,b.y,b.w,b.h,wall,b.x+b.y);pxRect(b.x,b.y,b.w,9,trim);pxRect(b.x+4,b.y+9,b.w-8,3,"#5c5147");
  if(b.id!=="park"){
    for(let yy=b.y+38;yy<b.y+b.h-47;yy+=35)for(let xx=b.x+10;xx<b.x+b.w-30;xx+=39)windowUnit(xx,yy,night&&((xx+yy)%3!==0));
    pxRect(b.x+b.w/2-16,b.y+b.h-43,32,43,"#44372f");pxRect(b.x+b.w/2-12,b.y+b.h-39,24,31,"#735946");

}

  [[12,602],[520,598],[185,632]].forEach(([px,py])=>{pxRect(px,py,17,22,"#515954");pxRect(px-2,py-3,21,4,"#313633");pxRect(px+4,py+5,9,2,"#7b827d");});

  plant(184,650);plant(358,650);plant(516,535);

  pxRect(390,548,110,5,"#4a514e");pxRect(395,552,5,70,"#4a514e");pxRect(495,552,5,70,"#4a514e");pxRect(400,555,90,55,"#7d8c89aa");signBoard(404,560,55,"BUS","#e5d29c");
  // moving cars/motorbikes with lights
  const t=S.mins*1.8;for(let i=0;i<6;i++){let vx=((t*(i%2?1:-1)+i*113)%600)-30,vy=i%2?250:510;let body=["#b85c52","#74869a","#b59a5e","#6d875f"][i%4];pxRect(vx,vy,32,11,body);pxRect(vx+4,vy+11,7,5,"#1d211f");pxRect(vx+21,vy+11,7,5,"#1d211f");pxRect(vx+(i%2?28:0),vy+2,3,3,night?"#f5d982":"#d8cdb5");}
}

const ASSET_READY=Promise.all(Object.keys(EMBEDDED_ASSETS).map(loadAsset)).catch(e=>{console.error(e);S.errors++;});
function pxRect(px,py,w,h,c){x.fillStyle=c;x.fillRect(Math.round(px),Math.round(py),Math.round(w),Math.round(h))}
function ttxt(s,px,py,size=9,c="#f5e4bc",align="center"){x.fillStyle=c;x.font=`bold ${size}px monospace`;x.textAlign=align;x.fillText(s,px,py)}
function tileNoise(px,py,w,h,base,seed=1){pxRect(px,py,w,h,base);for(let i=0;i<Math.floor(w*h/330);i++){let xx=px+((i*43+seed*17)%Math.max(1,w)),yy=py+((i*23+seed*11)%Math.max(1,h));pxRect(xx,yy,2+(i%3),1,i%2?"#5b605b55":"#9a9a9055")}}
function drawRoadDetails(){
  // drains and curb cuts
  for(let yy=565;yy<650;yy+=16)pxRect(0,yy,198,3,"#353a37");
  for(let xx=0;xx<W;xx+=38)pxRect(xx,892,18,4,"#5d5b56");
  // crosswalk
  for(let xx=202;xx<388;xx+=24)pxRect(xx,226,15,10,"#d8d1c3");
  // street lights
  [190,390].forEach(px=>{pxRect(px,245,4,115,"#363a37");pxRect(px-5,245,15,3,"#454a45");pxRect(px+5,247,9,3,"#d9c777")});
}
function drawBuilding(id,x0,y0,w,h,night){
  const im=ASSET["facade_"+id+"_v6"]; if(!im)return;
  pxRect(x0+5,y0+7,w+2,h+2,"#20252255");
  x.drawImage(im,x0,y0,w,h);
  if(night && id!=="park"){
    // windows glow, not a global tint
    for(let yy=y0+Math.round(h*.33);yy<y0+h*.68;yy+=30)
      for(let xx=x0+12;xx<x0+w-18;xx+=33)pxRect(xx,yy,13,8,"#f1d77a35");
  }
}
function drawProps(){
  const p=ASSET["props_v6"]; if(!p)return;
  const draw=(idx,px,py,scale=1)=>x.drawImage(p,(idx%8)*64,Math.floor(idx/8)*64,64,64,px,py,64*scale,64*scale);
  draw(0,145,574,.62);draw(0,325,585,.62);draw(0,476,552,.62);
  draw(1,20,610,.65);draw(1,155,610,.65);draw(1,360,565,.65);
  draw(2,410,548,.55);draw(3,82,552,.62);draw(3,455,600,.62);
  draw(4,5,590,.6);draw(4,500,588,.6);draw(5,170,640,.65);draw(5,350,640,.65);
  draw(6,397,557,.65);draw(7,205,55,.55);
}
function drawTraffic(){
  const v=ASSET["vehicles_v6"]; if(!v)return;
  const tm=S.mins*1.65;
  for(let i=0;i<6;i++){
    const vx=((tm*(i%2?1:-1)+i*109)%620)-40, vy=i%2?248:505;
    x.drawImage(v,i*96,0,96,64,vx,vy,48,32);
  }
}
function drawCharacters(){
  const ch=ASSET["characters_v6"]; if(!ch)return;
  const frame=Math.floor(performance.now()/150)%4;
  const npcIndex={mai:0,linh:1,khoa:2,nam:3,sau:4,lan:5};
  npc.forEach(n=>{
    let bx=n.x,by=n.y;
    if(n.id==="mai"){bx=125+Math.sin(S.mins/18)*25;by=250}
    if(n.id==="linh"){bx=425;by=520+Math.sin(S.mins/20)*15}
    if(n.id==="khoa"){bx=115+Math.sin(S.mins/14)*18;by=590}
    const idx=npcIndex[n.id]??0, dir=(Math.floor(S.mins/7)+idx)%4;
    x.drawImage(ch,idx*32,(dir*4+frame)*48,32,48,bx-16,by-31,32,48);
    ttxt(n.name,bx,by-35,8,"#f5e4bc");
  });
  const pdir=(Math.floor(S.mins/8))%4;
  x.drawImage(ch,6*32,(pdir*4+frame)*48,32,48,S.player.x-16,S.player.y-31,32,48);
  ttxt("Bạn",S.player.x,S.player.y-35,8,"#f5e4bc");
}
function drawAtmosphere(){
  const hour=(S.mins%1440)/60;
  const night=hour>=18.5||hour<5.5, sunset=hour>=17&&hour<18.5, morning=hour>=5.5&&hour<8;
  if(morning)pxRect(0,0,W,H,"#e4b98c18");
  if(sunset)pxRect(0,0,W,H,"#c47f5c20");
  if(night)pxRect(0,0,W,H,"#14202a55");
  // shop lights
  if(night)buildings.filter(b=>["rice","shop","cafe"].includes(b.id)).forEach(b=>pxRect(b.x+12,b.y+12,b.w-24,5,"#f0d17a44"));
  if(S.rain){for(let i=0;i<95;i++){let rx=(i*67+S.mins*3)%W,ry=(i*41+S.mins*6)%H;pxRect(rx,ry,1,7,"#b9d1d355")}}
}
function drawWorld(){
  const hour=(S.mins%1440)/60;
  const night=hour>=18.5||hour<5.5;
  x.fillStyle=night?"#243039":"#9aa9a3";x.fillRect(0,0,W,H);
  const gt=ASSET["ground_tiles_v6"];
  if(gt){
    for(let yy=0;yy<H;yy+=48)for(let xx=0;xx<W;xx+=48){
      let tile=(yy<225?3:(xx>=200&&xx<385?0:(yy>=280&&yy<460&&xx<190?4:(yy>895?7:1))));
      x.drawImage(gt,(tile%8)*48,Math.floor(tile/8)*48,48,48,xx,yy,48,48);
    }
  } else tileNoise(0,0,W,H,"#73766f");
  tileNoise(200,0,185,H,night?"#303633":"#484d49",7);
  tileNoise(0,225,W,55,night?"#303633":"#484d49",9);
  tileNoise(0,485,W,55,night?"#303633":"#484d49",12);
  tileNoise(0,650,W,30,night?"#303633":"#484d49",15);
  drawRoadDetails();
  x.strokeStyle="#d4c16f";x.lineWidth=2;x.setLineDash([13,18]);x.beginPath();x.moveTo(292,0);x.lineTo(292,H);x.stroke();x.setLineDash([]);
  // power poles and layered wires
  [205,351].forEach((px,i)=>{pxRect(px,0,6,300,"#393632");pxRect(px-8,36,22,4,"#514b45");x.strokeStyle="#292725";x.lineWidth=2;x.beginPath();x.moveTo(px,38);x.bezierCurveTo(px+90,68,310,100,520,24+i*26);x.stroke();});
  buildings.forEach(b=>drawBuilding(b.id,b.x,b.y,b.w,b.h,night));
  drawProps();
  drawTraffic();
  drawCharacters();
  drawAtmosphere();
}
function loop(){drawWorld();document.getElementById("day").textContent=`Ngày ${S.day} · ${timeStr()}`;document.getElementById("money").textContent=money(S.money);document.getElementById("energy").textContent="⚡ "+S.energy;document.getElementById("mood").textContent=(S.mood>65?"😄":S.mood>40?"🙂":"😵")+" "+S.mood;document.getElementById("place").textContent=placeName();document.getElementById("debug").textContent=`FPS-ish · ${S.place} · ${Math.round(S.player.x)},${Math.round(S.player.y)} · err:${S.errors}`;requestAnimationFrame(loop)}
function placeName(){return ({room:"Phòng trọ",school:"Trường học",rice:"Quán cơm",office:"Văn phòng",shop:"Tạp hóa",cafe:"Cà phê",park:"Công viên",street:"Đường phố"})[S.place]||"Đường phố"}
function panel(title,html){document.getElementById("ptitle").textContent=title;document.getElementById("pbody").innerHTML=html;document.getElementById("panel").classList.add("show")}
function closePanel(){document.getElementById("panel").classList.remove("show")}
function journal(){panel('📒 Sổ đời', `<div class="card"><b>Ngày ${S.day}</b><p class="muted">Tiền: ${money(S.money)} · Năng lượng: ${S.energy} · Tâm trạng: ${S.mood}</p></div><div class="card"><b>Quan hệ</b>${npc.map(n=>`<div class="row"><span>${n.name}</span><span>${S.rel[n.id]||0}%</span></div>`).join('')}</div><div class="card"><b>Đồ đã mua</b><p class="muted">${(S.inventory||[]).join(', ')||'Chưa có'}</p></div>`)}
function phone(){
 panel("📱 Điện thoại",`<div class="card"><b>Pin 68%</b><div class="muted">Thiết bị cũ nhưng vẫn đủ sống.</div></div>
 <div class="card"><div class="row"><b>💬 Tin nhắn</b><button class="action" data-app="messages">Mở</button></div></div>
 <div class="card"><div class="row"><b>❤️ Hẹn hò</b><button class="action" data-app="dating">Mở</button></div></div>
 <div class="card"><div class="row"><b>💼 Tìm việc</b><button class="action" data-app="jobs">Mở</button></div></div>
 <div class="card"><div class="row"><b>📰 Mạng xã hội</b><button class="action" data-app="social">Lướt</button></div></div>
 <div class="card"><div class="row"><b>🛒 Cửa hàng</b><button class="action" data-app="shop">Mua</button></div></div><div class="card"><div class="row"><b>📒 Sổ đời</b><button class="action" data-app="journal">Xem</button></div></div>`)}
function messages(){
 const ids=["mai","linh","khoa","nam"];panel("💬 Tin nhắn",ids.map(id=>{let n=npc.find(a=>a.id===id),last=S.messages[id].at(-1);return `<div class="card"><div class="row"><b>${n.name}</b><span class="muted">${S.rel[id]||0}% thân</span></div><div class="muted">${last?last.reply:"Chưa có tin nhắn"}</div><button class="action" data-chat="${id}">Nhắn tin</button></div>`}).join(""))}
function chat(id){
 let n=npc.find(a=>a.id===id),history=S.messages[id]||[];
 panel("💬 "+n.name,`<div class="chat" id="chatbox">${history.map(m=>`<div class="msg me">${esc(m.me)}</div><div class="msg npc">${esc(m.reply)}${m.source==='openai'?'<div class="muted" style="margin-top:4px">AI NPC</div>':''}</div>`).join("")||`<div class="muted">Bạn và ${n.name} chưa nói chuyện. Hãy thử nhắn một câu tự nhiên.</div>`}</div>
 <form id="chatform" style="display:flex;gap:6px;margin-top:12px"><textarea id="chatinput" placeholder="Nhắn gì đó..."></textarea><button class="action">Gửi</button></form>`);
 document.getElementById("chatform").onsubmit=async e=>{e.preventDefault();let input=document.getElementById("chatinput"),v=input.value.trim();if(!v)return;input.disabled=true;let r=await aiReply(n,v,id);S.messages[id].push({me:v,reply:r.reply,source:r.source});S.rel[id]=clamp((S.rel[id]||0)+(r.relationshipDelta||1),0,100);if(r.memory)S.flags["memory_"+id]=r.memory;S.mood=clamp(S.mood+1,0,100);save();chat(id)}
}
function esc(s){return s.replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[a]))}
async function aiReply(n,msg,id){
  const history=(S.messages[id]||[]).slice(-10).map(m=>({me:m.me,reply:m.reply}));
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({npcId:id,message:msg,history,relationship:S.rel[id]||0,mood:S.mood})});
    if(!r.ok)throw Error('AI backend unavailable');
    const data=await r.json();return {reply:data.reply||'Ừ, tôi đang nghĩ... :))',source:data.source||'openai',memory:data.memory,relationshipDelta:Number(data.relationshipDelta)||1};
  }catch(e){
    const q=msg.toLowerCase(),name=n.name;
    let reply;
    if(/chào|hello|hi/.test(q)) reply=name==='Mai'?'Ủa nay chủ động chào tôi luôn à :)) Có chuyện gì khai mau.':'Chào :)) Hôm nay sống ổn không?';
    else if(/mệt|buồn|stress|chán/.test(q)) reply=id==='linh'?'Mệt thì nghỉ một chút đi. Đời chưa chạy mất đâu.':'Than thì tôi nghe, nhưng nhớ ăn uống nhé. Đừng biến mình thành nhân vật nền.';
    else if(/đẹp|xinh|thích/.test(q)) reply=id==='mai'?'Nịnh ít thôi :)) Nhưng... nghe cũng được.':'Nói câu này với bao nhiêu người rồi?';
    else if(/đi chơi|cà phê|gặp/.test(q)) reply=(S.rel[id]||0)>35?'Được. Nhưng ông/bà định bao tôi hay tôi phải tự cứu ví mình? :))':'Mới nói chuyện mà rủ nhanh vậy :))';
    else if(/tiền|giàu|lương/.test(q)) reply='Nếu biết cách làm giàu bằng tin nhắn thì tôi đã không ngồi đây chat rồi :))';
    else if(q.includes('?')) reply='Câu hỏi hay đấy. Nhưng tôi cũng chưa dễ khai vậy đâu :))';
    else reply=['Nghe hợp lý đấy, nhưng tôi chưa bị thuyết phục đâu :))','Ông/bà nói cũng có lý. Có điều đời thường không hoạt động tử tế thế.','Câu này nghe giống người vừa nghĩ ra lúc 2 giờ sáng :))','Tôi ghi nhận. Nhưng tôi sẽ châm biếm chuyện này sau.'][Math.floor(Math.random()*4)];
    return {reply,source:'local-fallback',memory:null,relationshipDelta:reply.includes('=)')?2:1};
  }
}
function dating(){panel("❤️ Hẹn hò",npc.filter(n=>["mai","linh"].includes(n.id)).map(n=>`<div class="card"><div class="row"><b>${n.name}</b><span>${S.rel[n.id]}%</span></div><div class="muted">${n.tone}</div><button class="action" data-chat="${n.id}">Nhắn tin</button></div>`).join(""))}
function jobs(){panel("💼 Tìm việc",[
["shipper","🛵 Shipper","Chạy đơn, 90 phút · +180.000đ"],
["rice","🍚 Nhân viên quán cơm","Phục vụ, 120 phút · +220.000đ"],
["office","💻 Nhân viên văn phòng","Ca hành chính, 180 phút · +320.000đ"]
].map(j=>`<div class="card"><b>${j[1]}</b><div class="muted">${j[2]}</div><button class="action" data-job="${j[0]}">Nhận ca</button></div>`).join(""))}
function takeJob(job){S.job=job;let mins=job==="shipper"?90:job==="rice"?120:180,pay=job==="shipper"?180000:job==="rice"?220000:320000;advance(mins);S.money+=pay;S.energy=clamp(S.energy-12,0,100);S.mood=clamp(S.mood+(job==="office"?-2:2),0,100);toast(`Hoàn thành ca: +${money(pay)}`);save();closePanel()}
function social(){let posts=[["@nguoila","Lương 8 triệu, thuê trọ 4 triệu, tiền ăn 2 triệu. Phần còn lại dành để... suy nghĩ.","1,2k"],["@thanhpho","Tin nóng: người trẻ phát hiện ngủ đủ 8 tiếng là một truyền thuyết đô thị.","842"],["@anhban","Bạn bè đăng ảnh du lịch. Tôi đăng ảnh hóa đơn điện.","2,1k"],["@meocon","Có những ngày chỉ cần cơm nóng, wifi ổn và không ai hỏi 'bao giờ lấy chồng/lấy vợ'.","3,4k"]];panel("📰 Mạng xã hội",posts.map(p=>`<div class="card"><b>${p[0]}</b><p>${p[1]}</p><div class="muted">💬 ${p[2]} lượt tương tác</div></div>`).join(""))}
function shop(){panel("🛒 Cửa hàng",[["mì","🍜 Mì gói",12000],["coffee","☕ Cà phê",18000],["rain","☔ Áo mưa",45000],["shirt","👕 Áo thun",90000],["charger","🔌 Cáp sạc",70000],["phone2","📱 Điện thoại tốt hơn",350000]].map(a=>`<div class="card"><div class="row"><b>${a[1]}</b><span>${money(a[2])}</span></div><button class="action" data-buy="${a[0]}" data-price="${a[2]}">Mua</button></div>`).join(""))}
function buy(id,p){p=Number(p);if(S.money<p){toast("Ví không đủ tiền.");return}S.money-=p;S.inventory.push(id);S.mood=clamp(S.mood+2,0,100);toast("Đã mua.");save()}
function interact(){let target=npc.find(n=>near(S.player,n,75));if(target){chat(target.id);return}let b=buildingAt(S.player.x,S.player.y);if(b){S.place=b.id; if(b.id==="room")toast("Phòng trọ: ngủ, ăn, dùng điện thoại.");else toast("Đang ở "+b.label.toLowerCase()+". Mở điện thoại để xem việc/sự kiện.");return}toast("Không có gì đặc biệt ở đây. Nhưng cứ đi tiếp.")}
function goHome(){S.place="room";S.player.x=270;S.player.y=760;toast("Về phòng trọ.");save()}
document.getElementById("phone").onclick=phone;document.getElementById("interact").onclick=interact;document.getElementById("home").onclick=goHome;document.getElementById("close").onclick=closePanel;
document.getElementById("pbody").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.app==="messages")messages();if(b.dataset.app==="dating")dating();if(b.dataset.app==="jobs")jobs();if(b.dataset.app==="social")social();if(b.dataset.app==="shop")shop();if(b.dataset.chat)chat(b.dataset.chat);if(b.dataset.job)takeJob(b.dataset.job);if(b.dataset.buy)buy(b.dataset.buy,b.dataset.price)});
document.querySelectorAll(".pad .btn").forEach(b=>b.addEventListener("pointerdown",()=>{let cl=b.classList;if(cl.contains("up"))move(0,-1);if(cl.contains("down"))move(0,1);if(cl.contains("left"))move(-1,0);if(cl.contains("right"))move(1,0)}));
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key==="e")interact();if(e.key==="p")phone()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
setInterval(()=>{let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy)move(dx,dy)},30);
function integrity(){try{if(buildings.length<8||npc.length<8)throw Error('world_registry');if(!Number.isFinite(S.money)||S.money<0)throw Error("money");if(!Number.isFinite(S.player.x)||!Number.isFinite(S.player.y))throw Error("player");if(buildings.length<8||npc.length<8)throw Error("world");if(S.energy<0||S.energy>100)throw Error("energy")}catch(e){S.errors++;console.error(e);toast("Đã tự phát hiện lỗi trạng thái.");}}
load();setInterval(integrity,3000);ASSET_READY.then(()=>toast('Visual Overhaul V6 đã sẵn sàng.'));loop();
})();
</script>
